<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKINOL - Забери свой дроп</title>
    <style>
        :root {
            --bg-dark: #0d1015;
            --panel-bg: #1a1d24;
            --accent: #00ff66;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e38;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #242833;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
        }

        .balance span {
            color: var(--accent);
        }

        nav {
            display: flex;
            background-color: var(--panel-bg);
            padding: 10px 20px;
            gap: 10px;
            border-bottom: 1px solid #2a2e38;
            overflow-x: auto;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 6px;
            transition: 0.2s;
            white-space: nowrap;
        }

        nav a.active, nav a:hover {
            background-color: #242833;
            color: var(--text-main);
        }

        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .case-card {
            background-color: var(--panel-bg);
            border: 1px solid #2a2e38;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .case-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .case-image {
            width: 80px;
            height: 80px;
            background: #242833;
            margin: 0 auto 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .case-name {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .case-price {
            color: var(--accent);
            font-weight: 700;
            font-size: 14px;
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .upgrader-container {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SKIN<span>OL</span></div>
        <div class="balance">
            💎 <span id="balance-amount">100</span>
        </div>
    </header>

    <nav>
        <a href="#" class="active" onclick="switchTab(event, 'cases')">Кейсы</a>
        <a href="#" onclick="switchTab(event, 'upgrader')">Апгрейд</a>
        <a href="#" onclick="switchTab(event, 'inventory')">Инвентарь</a>
    </nav>

    <main>
        <!-- Кейсы -->
        <div id="cases" class="section active">
            <h2>Популярные дропы</h2>
            <div class="cases-grid">
                <div class="case-card" onclick="openCase(10)">
                    <div class="case-image">📦</div>
                    <div class="case-name">Mil-Spec Case</div>
                    <div class="case-price">10 💎</div>
                </div>
                <div class="case-card" onclick="openCase(50)">
                    <div class="case-image">📦</div>
                    <div class="case-name">Restricted Case</div>
                    <div class="case-price">50 💎</div>
                </div>
                <div class="case-card" onclick="openCase(100)">
                    <div class="case-image">📦</div>
                    <div class="case-name">Covert Case</div>
                    <div class="case-price">100 💎</div>
                </div>
            </div>
        </div>

        <!-- Апгрейд -->
        <div id="upgrader" class="section">
            <div class="upgrader-container">
                <h2 style="margin-bottom: 10px;">Апгрейд скинов</h2>
                <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 14px;">Повышай редкость своих предметов</p>
                <div class="case-image" style="width: 120px; height: 120px; font-size: 50px;">🔫</div>
                <button class="btn">Выбрать скин</button>
            </div>
        </div>

        <!-- Инвентарь -->
        <div id="inventory" class="section">
            <h2>Твой инвентарь</h2>
            <p style="color: var(--text-muted); margin-top: 15px;">Здесь пока пусто.</p>
        </div>
    </main>

    <script>
        let balance = 100;

        function switchTab(event, tabId) {
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        function openCase(price) {
            if (balance >= price) {
                balance -= price;
                document.getElementById('balance-amount').innerText = balance;
                alert('Кейс открывается...');
            } else {
                alert('Недостаточно кристаллов на балансе!');
            }
        }
    </script>
</body>
</html>
.
