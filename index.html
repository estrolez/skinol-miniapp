<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Skinol</title>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#161b22;position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:20px;letter-spacing:1px;color:#ff6b3d}
.bal{background:#21262d;padding:6px 14px;border-radius:20px;font-weight:700}
main{padding:14px;max-width:520px;margin:0 auto}
.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.card .ic{font-size:40px}.card .info{flex:1}.card .t{font-weight:700}.card .p{color:#8b949e;font-size:14px}
button{background:#ff6b3d;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.4}button.sec{background:#30363d}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#161b22;border-top:1px solid #30363d;padding-bottom:env(safe-area-inset-bottom)}
nav div{flex:1;text-align:center;padding:12px 0;color:#8b949e;font-weight:600;font-size:14px}
nav div.on{color:#ff6b3d}
.hide{display:none!important}
.vp{position:relative;overflow:hidden;background:#010409;border-radius:12px;height:130px;margin:10px 0}
.vp::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#ff6b3d;transform:translateX(-50%);z-index:2}
.strip{display:flex;height:100%;align-items:center;will-change:transform}
.it{flex:0 0 104px;margin-right:8px;height:104px;border-radius:10px;background:#161b22;border-bottom:4px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:4px}
.it b{font-size:28px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#161b22;border-radius:16px;padding:18px;width:100%;max-width:440px;text-align:center}
.win{font-size:64px;margin:6px 0}.name{font-size:20px;font-weight:800;margin:4px 0}
.row{display:flex;gap:8px;justify-content:center;margin-top:14px}
.inv{display:flex;align-items:center;gap:10px;background:#161b22;border-left:4px solid var(--c);border-radius:10px;padding:10px;margin-bottom:8px}
.inv .n{flex:1;font-size:14px}.inv small{color:#8b949e}
h3{margin:4px 0 12px}
</style>
</head>
<body>
<header><div class="logo">SKINOL</div><div class="bal">💎 <span id="bal">0</span></div></header>
<main>
  <section id="tab-cases"></section>
  <section id="tab-inv" class="hide"></section>
  <section id="tab-bonus" class="hide"></section>
</main>
<nav>
  <div class="on" data-t="cases">📦 Кейсы</div>
  <div data-t="inv">🎒 Инвентарь</div>
  <div data-t="bonus">🎁 Бонус</div>
</nav>
<div id="modal" class="modal hide"><div class="box" id="box"></div></div>

<script>
let tg = null;
function initTg() { try { tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); } } catch (e) {} }
initTg(); window.addEventListener("load", initTg);

const RAR = {
  consumer:  {n:"Ширпотреб",   c:"#b0c3d9", w:50,  p:[5,15],      e:"⚪"},
  milspec:   {n:"Армейское",    c:"#4b69ff", w:30,  p:[20,60],     e:"🔵"},
  restricted:{n:"Запрещённое", c:"#8847ff", w:13,  p:[80,200],    e:"🟣"},
  classified:{n:"Засекреченное",c:"#d32ce6",w:5,   p:[250,600],   e:"🌸"},
  covert:    {n:"Тайное",       c:"#eb4b4b", w:1.8, p:[800,2000],  e:"🔴"},
  gold:      {n:"Редкое золото",c:"#ffd700", w:0.2, p:[3000,8000], e:"🟡"}
};
const SKINS = {
  consumer:["P250 | Sand Dune","MP9 | Storm","Nova | Predator"],
  milspec:["MAC-10 | Neon Rider","Glock-18 | Water Elemental","SG 553 | Cyrex"],
  restricted:["AK-47 | Redline","M4A4 | Desolate Space","USP-S | Cortex"],
  classified:["AWP | Asiimov","M4A1-S | Hyper Beast","Desert Eagle | Blaze"],
  covert:["AK-47 | Fire Serpent","AWP | Dragon Lore","M4A4 | Howl"],
  gold:["★ Karambit | Fade","★ Butterfly | Doppler","★ Sport Gloves | Vice"]
};
const ELITE = {consumer:0, milspec:.5, restricted:1.5, classified:2.5, covert:3, gold:4};
const CASES = {
  welcome:{n:"Велком-кейс",  e:"🎁", price:0},
  basic:  {n:"Базовый кейс", e:"📦", price:100},
  elite:  {n:"Элитный кейс", e:"💎", price:400}
};
const DAILY = 25;

let S;
try { S = JSON.parse(localStorage.getItem("skinol")); } catch (e) {}
S = S || {crystals: 100, welcome: false, last: 0, inv: [], opened: 0};
const save = () => { try { localStorage.setItem("skinol", JSON.stringify(S)); } catch (e) {} };
const $ = id => document.getElementById(id);
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

function roll(cid) {
  const keys = Object.keys(RAR);
  const ws = keys.map(k => RAR[k].w * (cid === "elite" ? ELITE[k] : 1));
  let x = Math.random() * ws.reduce((a, b) => a + b, 0), k = keys[0];
  for (let i = 0; i < keys.length; i++) { x -= ws[i]; if (x <= 0) { k = keys[i]; break; } }
  const name = SKINS[k][rnd(0, SKINS[k].length - 1)];
  return {r: k, name, price: rnd(RAR[k].p[0], RAR[k].p[1]), id: Date.now() + Math.random()};
}

function render() {
  $("bal").textContent = S.crystals;
  // cases
  $("tab-cases").innerHTML = "<h3>Выбери кейс</h3>" + Object.entries(CASES).map(([id, c]) => {
    const used = id === "welcome" && S.welcome;
    const lack = c.price > S.crystals;
    return `<div class="card"><div class="ic">${c.e}</div><div class="info"><div class="t">${c.n}</div>
      <div class="p">${c.price ? c.price + " 💎" : "бесплатно (1 раз)"}</div></div>
      <button ${used || lack ? "disabled" : ""} onclick="openCase('${id}')">${used ? "Открыт" : "Открыть"}</button></div>`;
  }).join("");
  // inventory
  const inv = [...S.inv].sort((a, b) => b.price - a.price);
  $("tab-inv").innerHTML = `<h3>Инвентарь (${inv.length})</h3>` + (inv.length
    ? inv.map(i => `<div class="inv" style="--c:${RAR[i.r].c}"><div class="n">${RAR[i.r].e} ${i.name}<br><small>${RAR[i.r].n}</small></div>
        <button class="sec" onclick="sell(${i.id})">${i.price} 💎</button></div>`).join("")
      + `<button style="width:100%;margin-top:6px" onclick="sellAll()">Продать всё</button>`
    : `<div class="card"><div class="info p">Пока пусто. Открой кейс!</div></div>`);
  // bonus
  const left = 86400000 - (Date.now() - S.last);
  const ready = left <= 0;
  $("tab-bonus").innerHTML = `<h3>Бонус дня</h3><div class="card"><div class="ic">🎁</div><div class="info">
    <div class="t">+${DAILY} 💎 каждый день</div><div class="p">${ready ? "Можно забрать!" : "Через ~" + Math.ceil(left / 3600000) + " ч."}</div></div>
    <button ${ready ? "" : "disabled"} onclick="daily()">Забрать</button></div>
    <div class="card"><div class="info p">Открыто кейсов: <b>${S.opened}</b></div></div>`;
}

function openCase(cid) {
  const c = CASES[cid];
  if (cid === "welcome" && S.welcome) return;
  if (S.crystals < c.price) return;
  S.crystals -= c.price;
  if (cid === "welcome") S.welcome = true;
  const win = roll(cid);
  S.inv.push(win); S.opened++; save(); render();

  // build strip
  const WIN_IDX = 36, TOTAL = 44;
  const items = [];
  for (let i = 0; i < TOTAL; i++) items.push(i === WIN_IDX ? win : roll(cid));
  $("box").innerHTML = `<h3>${c.e} ${c.n}</h3><div class="vp"><div class="strip" id="strip">` +
    items.map(i => `<div class="it" style="--c:${RAR[i.r].c}"><b>${RAR[i.r].e}</b>${i.name}</div>`).join("") +
    `</div></div><div id="res"></div>`;
  $("modal").classList.remove("hide");

  const strip = $("strip"), vpw = strip.parentElement.clientWidth;
  const target = WIN_IDX * 112 + 52 - vpw / 2 + rnd(-35, 35);
  strip.style.transform = "translateX(0)";
  strip.getBoundingClientRect();
  strip.style.transition = "transform 5.5s cubic-bezier(.12,.6,.1,1)";
  strip.style.transform = `translateX(${-target}px)`;
  try { tg && tg.HapticFeedback.impactOccurred("medium"); } catch (e) {}

  setTimeout(() => {
    $("res").innerHTML = `<div class="win">${RAR[win.r].e}</div><div class="name" style="color:${RAR[win.r].c}">${win.name}</div>
      <div class="p" style="color:#8b949e">${RAR[win.r].n} · ${win.price} 💎</div>
      <div class="row"><button class="sec" onclick="sell(${win.id});closeM()">Продать</button>
      <button onclick="closeM()">Забрать</button></div>`;
    try { tg && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  }, 5700);
}

function closeM() { $("modal").classList.add("hide"); render(); }
function sell(id) {
  const i = S.inv.findIndex(x => x.id === id);
  if (i < 0) return;
  S.crystals += S.inv[i].price; S.inv.splice(i, 1); save(); render();
}
function sellAll() { S.crystals += S.inv.reduce((a, b) => a + b.price, 0); S.inv = []; save(); render(); }
function daily() {
  if (Date.now() - S.last < 86400000) return;
  S.crystals += DAILY; S.last = Date.now(); save(); render();
}

document.querySelectorAll("nav div").forEach(d => d.onclick = () => {
  document.querySelectorAll("nav div").forEach(x => x.classList.toggle("on", x === d));
  ["cases", "inv", "bonus"].forEach(t => $("tab-" + t).classList.toggle("hide", t !== d.dataset.t));
  render();
});
render();
</script>
</body>
</html>
